# SOBH continuous integration (§41).
#
#   lint -> unit tests -> integration tests -> build -> security scan -> image
#
# Deployment to staging happens on a green run of the default branch; the
# production step is a separate, manually approved workflow.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"
  FLUTTER_VERSION: "3.29.0"

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: gofmt
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: staticcheck
        working-directory: backend
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sobh
          POSTGRES_PASSWORD: sobh_ci
          POSTGRES_DB: sobh_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sobh -d sobh_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      SOBH_TEST_POSTGRES_DSN: postgres://sobh:sobh_ci@localhost:5432/sobh_test?sslmode=disable
      SOBH_TEST_REDIS_ADDR: localhost:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Apply migrations
        working-directory: backend
        env:
          POSTGRES_DSN: ${{ env.SOBH_TEST_POSTGRES_DSN }}
          JWT_SIGNING_KEYS: ci-1:ci_signing_key_at_least_32_bytes_long_value
        run: go run ./cmd/migrate -dir ../database/migrations up

      - name: Unit and integration tests
        working-directory: backend
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        working-directory: backend
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  backend-security:
    name: Backend security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database:
    name: Migrations reversible
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sobh
          POSTGRES_PASSWORD: sobh_ci
          POSTGRES_DB: sobh_migrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sobh -d sobh_migrate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DSN: postgres://sobh:sobh_ci@localhost:5432/sobh_migrate?sslmode=disable
      JWT_SIGNING_KEYS: ci-1:ci_signing_key_at_least_32_bytes_long_value
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # Every migration must roll back cleanly, or a bad deploy cannot be undone.
      - name: up, down, up again
        working-directory: backend
        run: |
          go run ./cmd/migrate -dir ../database/migrations up
          go run ./cmd/migrate -dir ../database/migrations down 99
          go run ./cmd/migrate -dir ../database/migrations up
          go run ./cmd/migrate -dir ../database/migrations status

  flutter:
    name: Flutter analyse and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [mobile, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      # Drift, Freezed and Riverpod generate part files that are not committed.
      - name: Generate code
        working-directory: apps/${{ matrix.app }}
        run: dart run build_runner build --delete-conflicting-outputs

      # Localisations are generated from the ARB files rather than committed,
      # so an edited translation cannot be silently ignored by a stale copy.
      - name: Generate localisations
        working-directory: apps/${{ matrix.app }}
        run: test -f l10n.yaml && flutter gen-l10n || echo "no l10n.yaml"

      - name: Verify formatting
        working-directory: apps/${{ matrix.app }}
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: apps/${{ matrix.app }}
        run: flutter test --coverage

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, database]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: sobh/api:${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: sobh/api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
