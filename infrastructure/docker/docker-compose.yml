# SOBH development stack (§39).
#
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
#
# Credentials here are development defaults and are safe to read: the
# production profile refuses to start with any of them (see internal/config).
name: sobh

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sobh
      POSTGRES_PASSWORD: sobh_dev_password
      POSTGRES_DB: sobh
      # Persian and Arabic content sorts correctly under ICU.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=und"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sobh -d sobh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O - http://localhost:8222/healthz 2>&1 | grep -q '200 OK'"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: sobh_dev_access
      MINIO_ROOT_PASSWORD: sobh_dev_secret_key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      # Disabled locally only; staging and production run with the security
      # plugin enabled and TLS between nodes.
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    entrypoint: ["/usr/local/bin/migrate", "-dir", "/app/migrations", "up"]
    env_file: [../../.env]
    environment:
      POSTGRES_DSN: postgres://sobh:sobh_dev_password@postgres:5432/sobh?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: on-failure

  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: [../../.env]
    environment:
      POSTGRES_DSN: postgres://sobh:sobh_dev_password@postgres:5432/sobh?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      OPENSEARCH_ADDRESSES: http://opensearch:9200
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    entrypoint: ["/usr/local/bin/worker"]
    restart: unless-stopped
    env_file: [../../.env]
    environment:
      POSTGRES_DSN: postgres://sobh:sobh_dev_password@postgres:5432/sobh?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
    depends_on:
      api: { condition: service_started }

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9091:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: sobh_dev_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ../monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
  opensearch_data:
  prometheus_data:
  grafana_data:
  loki_data:
