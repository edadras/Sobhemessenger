# Edge configuration for SOBH (§33, §73).
# TLS terminates here; the API sees plain HTTP behind it.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  8192;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,'
        '"request_id":"$http_x_request_id","user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;

    # Uploads stream to object storage via presigned URLs, so the API itself
    # only ever receives small JSON bodies.
    client_max_body_size 2m;
    client_body_timeout 30s;

    # Shared throttles in front of the application's own limiter.
    limit_req_zone $binary_remote_addr zone=api:16m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:8m  rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=conn:16m;

    upstream sobh_api {
        server api:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # In production this block sits behind TLS 1.3 termination; the API
        # emits HSTS itself, so it is not duplicated here.

        location /health {
            proxy_pass http://sobh_api;
            access_log off;
        }

        # WebSocket: no buffering, and a read timeout longer than the
        # application's 25s heartbeat so idle sockets are not cut.
        location /ws {
            proxy_pass http://sobh_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            limit_conn conn 20;
        }

        # Authentication endpoints get the tighter throttle.
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://sobh_api;
            include /etc/nginx/proxy_headers.conf;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            limit_conn conn 50;
            proxy_pass http://sobh_api;
            include /etc/nginx/proxy_headers.conf;
        }

        location / {
            return 404;
        }
    }
}
