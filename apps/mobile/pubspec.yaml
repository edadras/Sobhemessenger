name: sobh_app
description: SOBH — messenger, media and news platform.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management and routing (§3)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0
  web_socket_channel: ^3.0.2
  connectivity_plus: ^6.1.3

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Offline-first storage (§46)
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  path: ^1.9.1
  # Theme and language are preferences, not secrets, so they do not belong in
  # the keychain (§43)
  shared_preferences: ^2.5.2

  # Security: private keys and tokens never leave the keychain/keystore (§23)
  flutter_secure_storage: ^9.2.4

  # Contact discovery hashes every number on the device before it is uploaded,
  # so the address book plugin and HMAC live together here (§54)
  crypto: ^3.0.6
  flutter_contacts: ^1.1.9

  # Media and cache (§47)
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  just_audio: ^0.9.46
  record: ^5.2.1

  # Location messages (§12). geolocator asks the platform for a fix; the app
  # never embeds a map — opening the coordinates in whatever map application
  # the device has avoids shipping a tile provider's SDK and telling it where
  # every user is.
  geolocator: ^13.0.2
  url_launcher: ^6.3.1

  # Calls (§18)
  flutter_webrtc: ^0.12.5

  # Notifications (§30)
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  # 2.6.5 pulls riverpod_analyzer_utils 0.5.10, which requires
  # freezed_annotation 3.x and so cannot resolve alongside freezed 2.x.
  riverpod_generator: ^2.6.4
  drift_dev: ^2.25.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
