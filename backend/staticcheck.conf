# ST1018 objects to Unicode format characters inside string literals, on the
# assumption that an invisible character in source is a mistake.
#
# In Persian it is not. U+200C, the zero-width non-joiner, is the نیم‌فاصله: an
# ordinary part of the orthography that separates a prefix or suffix from its
# stem without a full space. "می‌رود" and "میرود" are not the same word, and
# "نیم‌فاصله" written without it is misspelled.
#
# The alternative the rule suggests — writing every occurrence as ‌ — would
# turn every user-facing Persian string in the project into something no
# Persian speaker can read or review, in exchange for no safety at all. The
# strings are checked by a separate scan for characters that really are
# mistakes, such as Cyrillic letters that look like Latin ones.
checks = ["all", "-ST1018"]
