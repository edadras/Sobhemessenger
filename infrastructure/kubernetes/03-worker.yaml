apiVersion: apps/v1
kind: Deployment
metadata:
  name: sobh-worker
  namespace: sobh
  labels: { app: sobh-worker, component: worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: sobh-worker }
  template:
    metadata:
      labels: { app: sobh-worker, component: worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/sobh/worker:latest
          command: ["/usr/local/bin/worker"]
          envFrom:
            - configMapRef: { name: sobh-config }
            - secretRef: { name: sobh-secrets }
          env:
            - name: NODE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources:
            # Media transcoding is CPU-bound and needs far more headroom than
            # the API; scratch space for ffmpeg comes from an emptyDir.
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "4", memory: 4Gi }
          volumeMounts:
            - { name: scratch, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: scratch
          emptyDir: { sizeLimit: 20Gi }
      terminationGracePeriodSeconds: 120
