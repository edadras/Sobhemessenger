# Prometheus scrape configuration (§35).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: sobh

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sobh-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:9090"]
        labels:
          component: api

  - job_name: sobh-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9090"]
        labels:
          component: worker

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
